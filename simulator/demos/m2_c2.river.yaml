version: 1
artifact:
    # Template fields resolved by `river-manifest repair` using MODELS_DIR.
    binary: $MODELS_DIR/ToyModel/Simulink2Code_ert_rtw/Simulink2Code
    build_id: $BUILD_ID
settings:
    cycles: 20
    sample_every: 1
    timer:
      model: Simulink2Code
      hook: step
models:
    - name: Simulink2Code
      enabled: true
      hooks:
        - id: step
          phase: return
          action: read
          data:
            - Simulink2Code.Simulink2Code_U.x
            - Simulink2Code.Simulink2Code_U.y
            - Simulink2Code.Simulink2Code_Y.result
            - Simulink2Code.model_offset
      available_hooks:
        - id: getRTM
        - id: initialize
        - id: step
        - id: terminate
      inputs:
        - name: x
          path: Simulink2Code.Simulink2Code_U.x
          category: input
          type: float64
          supported: true
        - name: "y"
          path: Simulink2Code.Simulink2Code_U.y
          category: input
          type: float64
          supported: true
      outputs:
        - name: result
          path: Simulink2Code.Simulink2Code_Y.result
          category: output
          type: float64
          supported: true
      states:
        - name: moffset
          path: Simulink2Code.model_offset
          type: float64
          address: 0x20018 
