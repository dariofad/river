[project]
name = "river"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "matplotlib==3.10.8",
    "msgpack==1.1.2",
    "numpy==2.4.6",
    "pandas==3.0.1",
    "plotly==6.6.0",
    "PyYAML==6.0.3",
    "redis==7.3.0",
]

[dependency-groups]
dev = [
    "ruff==0.12.0",
    "pyrefly==1.3.2",
    "pre-commit>=4.6.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["client", "dashboard"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.pyrefly]
search-path = ["client", "dashboard"]
python-version = "3.14"

